<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Fourteen observed SST maps become three forecast maps</title>
  <desc id="desc">A sequence of fourteen small map grids for observed days 1 through 14 feeds a forecasting model, which outputs three map grids for forecast days 1 through 3. The same geographic grid is used throughout.</desc>
  <rect width="1200" height="220" rx="18" fill="#f8fafc"/>
  <text x="42" y="42" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#172434">Observed SST · 14 daily maps</text>
  <text x="780" y="42" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#172434">Forecast SST · next 3 days</text>
  <g fill="none" stroke="#41556b" stroke-width="1.4">
    <path d="M42 177H646"/>
    <path d="M782 177H1106"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="12" fill="#40566b">
    <text x="64" y="198">1</text><text x="106" y="198">2</text><text x="148" y="198">3</text><text x="190" y="198">4</text>
    <text x="232" y="198">5</text><text x="274" y="198">6</text><text x="316" y="198">7</text><text x="358" y="198">8</text>
    <text x="400" y="198">9</text><text x="442" y="198">10</text><text x="484" y="198">11</text><text x="526" y="198">12</text>
    <text x="568" y="198">13</text><text x="610" y="198">14</text>
    <text x="826" y="198">+1</text><text x="944" y="198">+2</text><text x="1062" y="198">+3</text>
  </g>
  <defs>
    <linearGradient id="water" x2="1" y2="1"><stop stop-color="#275d8c"/><stop offset=".53" stop-color="#47a6b1"/><stop offset="1" stop-color="#e1ad61"/></linearGradient>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width=".6"/></pattern>
    <g id="small-map"><rect width="32" height="74" rx="3" fill="url(#water)"/><rect width="32" height="74" rx="3" fill="url(#grid)"/></g>
    <g id="large-map"><rect width="82" height="74" rx="4" fill="url(#water)"/><rect width="82" height="74" rx="4" fill="url(#grid)"/></g>
  </defs>
  <g transform="translate(48 82)">
    <use href="#small-map" x="0"/><use href="#small-map" x="42"/><use href="#small-map" x="84"/><use href="#small-map" x="126"/>
    <use href="#small-map" x="168"/><use href="#small-map" x="210"/><use href="#small-map" x="252"/><use href="#small-map" x="294"/>
    <use href="#small-map" x="336"/><use href="#small-map" x="378"/><use href="#small-map" x="420"/><use href="#small-map" x="462"/>
    <use href="#small-map" x="504"/><use href="#small-map" x="546"/>
  </g>
  <g transform="translate(785 82)"><use href="#large-map" x="0"/><use href="#large-map" x="118"/><use href="#large-map" x="236"/></g>
  <path d="M646 120H766M754 111L766 120L754 129" fill="none" stroke="#7053a2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="706" y="101" font-family="Arial, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="#7053a2">model</text>
</svg>
